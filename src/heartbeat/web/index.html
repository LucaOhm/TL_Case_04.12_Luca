<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heartbeat – Automations-Wächter</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f5bea'/%3E%3Cpath d='M4 17h6l3-8 5 15 3-7h7' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/slack.css">
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M4 17h6l3-8 5 15 3-7h7" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Heartbeat <span class="pill" title="Dashboard-Mockup auf echten Daten. Slack ist simuliert.">Mockup</span>
  </div>
  <div class="stepper" role="group" aria-label="Zeitpunkt">
    <button id="prev" aria-label="Früherer Morgen">‹</button>
    <select id="when" aria-label="Briefing-Zeitpunkt"></select>
    <button id="next" aria-label="Späterer Morgen">›</button>
  </div>
  <div class="right">
    <select id="who" aria-label="Ansicht als"></select>
    <a class="btn" id="slacklink" href="/slack" target="_blank" rel="noopener">Slack-Mockup ↗</a>
    <button class="btn primary" id="tourbtn">Geführte Tour</button>
  </div>
</div></header>

<main class="wrap">
  <div id="banner"></div>
  <section class="kpis" id="kpis" aria-label="Kennzahlen"></section>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <section id="view"></section>
</main>
<div id="tour"></div>
<div id="toast"></div>
<script src="/static/blocks.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
